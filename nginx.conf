
# Nginx Configuration for Infra-Inventory
# This file can be included in your main nginx configuration or symlinked to /etc/nginx/sites-enabled/

server {
    listen 5400;  # Listening on port 5400 as per your previous setup
    server_name _; # Accept connections for any domain/IP

    location / {
        proxy_pass http://localhost:5000; # Assuming your app runs internally on port 5000
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Serve static files directly if needed for performance
    # location /assets/ {
    #     alias /path/to/your/app/dist/public/assets/;
    #     expires 1y;
    #     add_header Cache-Control "public";
    # }
}
